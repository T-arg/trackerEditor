<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATMlib Song Editor</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css?family=Cookie&display=swap" rel="stylesheet" />
<style>:root{--bg:#fefefd;--panel:#f5f5f3;--ink:#333;--muted:#6b5f5e;--accent:#4a3b3a;--warn:#c0392b;--yellow:#f4d35e;--line:#ddd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 14px;background:#fefefd;border-bottom:3px solid #4a3b3a;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.site-logo{display:flex;align-items:center;flex-shrink:0}.site-logo img{height:44px;width:auto;display:block}
header h1{font-size:16px;margin:0;color:#4a3b3a;letter-spacing:.04em}
.bmc-slot{margin-left:auto;display:flex;align-items:center}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
button,select,input[type=number],input[type=text]{background:#4a3b3a;color:#fefefd;border:1px solid #4a3b3a;padding:3px 8px;border-radius:3px;font:inherit}
button:hover{background:#2e2424;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.active{background:#2e2424;box-shadow:inset 0 0 0 1px #fefefd}
button.ghost{background:#fff;color:#4a3b3a}button.ghost:hover{background:#eee}
button.play{background:#f4d35e;color:#2e2424;border-color:#4a3b3a;font-weight:600;min-width:70px}
button.play.on{background:#c0392b;color:#fff}
button.sm{padding:1px 6px;font-size:12px}
input[type=number],input[type=text],select.light{background:#fff;color:#333}
input[type=number]{width:62px}
input[type=range]{accent-color:#4a3b3a;width:90px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;height:calc(100vh - 62px);min-height:0}
.panel{padding:10px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.panel.right{border-right:0;border-left:1px solid var(--line);background:#f7f6f4}
.panel.main{background:var(--bg);display:flex;flex-direction:column;padding:0;overflow:hidden}
.panel h2{font-size:12px;margin:12px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.panel h2:first-child{margin-top:0}
.tabs{display:flex;gap:2px;margin:-10px -10px 10px;border-bottom:2px solid #4a3b3a;background:#ebe8e4;position:sticky;top:-10px;z-index:3}
.tabs button{flex:1;border-radius:0;background:transparent;color:#4a3b3a;border:0;padding:6px 4px}
.tabs button.active{background:#4a3b3a;color:#fefefd;box-shadow:none}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:78px;color:var(--muted)}
.hint{color:var(--muted);font-size:12px}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;margin:3px 0;cursor:grab}
.item:hover{border-color:#4a3b3a}.item.sel{border-color:#4a3b3a;box-shadow:inset 3px 0 0 #f4d35e}
.item .chip{width:10px;height:22px;border-radius:2px;flex-shrink:0}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--muted);font-size:11px}
.item canvas{display:block;flex-shrink:0}
.cat{font-size:11px;color:var(--muted);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.desc{font-size:11px;color:var(--muted);margin:0 0 4px 2px}
.arr{border-bottom:2px solid #4a3b3a;background:#faf9f7;flex:0 0 auto;max-height:46%;display:flex;flex-direction:column;min-height:150px}
.bar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:#f1efeb;flex-wrap:wrap}
.bar b{color:var(--accent)}
.arr-scroll{overflow:auto;flex:1;position:relative}
.arr-inner{position:relative;min-width:100%}
.ruler{height:20px;position:relative;border-bottom:1px solid var(--line);margin-left:92px;background:#f1efeb}
.ruler span{position:absolute;top:2px;font-size:10px;color:var(--muted);border-left:1px solid #bbb;padding-left:2px;height:16px}
.lane{display:flex;height:50px;border-bottom:1px solid var(--line)}
.lane .lab{width:92px;flex-shrink:0;position:sticky;left:0;z-index:4;background:#ebe8e4;border-right:1px solid #bbb;padding:3px 6px;font-size:11px;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.lane .lab b{color:var(--accent)}
.lane .lab .mute{font-size:10px;padding:0 4px;margin-top:2px;width:max-content}
.lane .track{position:relative;flex:1}
.lane.drop .track{background:#fff6d6}
.blk{position:absolute;top:4px;height:42px;border-radius:4px;color:#fff;font-size:11px;padding:2px 5px;overflow:hidden;white-space:nowrap;cursor:grab;border:2px solid transparent;user-select:none}
.blk.sel{border-color:#f4d35e;box-shadow:0 0 0 2px #4a3b3a}
.blk small{display:block;opacity:.8;font-size:10px}
.blk canvas{position:absolute;left:0;right:0;bottom:0;opacity:.55;pointer-events:none}
.pad{position:absolute;top:4px;bottom:4px;background:repeating-linear-gradient(45deg,#e9e5df,#e9e5df 4px,#f3f0ec 4px,#f3f0ec 8px);border:1px dashed #b9b1a8;border-radius:4px;pointer-events:none}
.ins{position:absolute;top:2px;bottom:2px;width:3px;background:#c0392b;z-index:5;pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#c0392b;z-index:6;pointer-events:none;display:none}
.bargrid{position:absolute;top:20px;bottom:0;border-left:1px dotted #d6d0c8;pointer-events:none}
.ped{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ped-scroll{flex:1;overflow:auto;position:relative;background:#fff}
.roll{display:flex;width:max-content}
.roll canvas.keys{position:sticky;left:0;z-index:2}
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty div{border:1px dashed #4a3b3a;border-radius:8px;padding:26px;background:#fff;display:inline-block;max-width:520px}
.kv{width:100%;border-collapse:collapse}.kv td{padding:1px 3px;font-size:12px}
.msg{padding:6px 8px;border-radius:4px;margin:4px 0;font-size:12px}
.msg.err{background:#fbe3df;border:1px solid #c0392b;color:#7b1f14}
.msg.warn{background:#fff3d1;border:1px solid #c9a227;color:#6b5400}
.msg.ok{background:#e3f1e3;border:1px solid #3d6b3d;color:#244224}
textarea.code{width:100%;height:300px;font:11px/1.35 ui-monospace,monospace;border:1px solid #4a3b3a;padding:6px;background:#fff;color:#333;resize:vertical}
.bmc-btn{min-width:200px;color:#fefefd!important;background:#5d4c4b!important;height:48px;border-radius:12px;font-size:24px;font-weight:normal;border:none;padding:0 20px;line-height:24px;text-decoration:none!important;display:inline-flex!important;align-items:center;font-family:"Cookie",cursive!important}
.bmc-btn-text{margin-left:8px;white-space:nowrap;line-height:1}
kbd{font:11px ui-monospace,monospace;border:1px solid #4a3b3a;border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#4a3b3a;color:#fff;padding:8px 16px;border-radius:6px;z-index:99;display:none;max-width:80vw}
a.manual{color:#4a3b3a;text-decoration:none;border:1px solid #4a3b3a;border-radius:3px;padding:3px 8px;background:#f4d35e;font-weight:600}
a.manual:hover{background:#e8c443}
.modal{position:fixed;inset:0;background:rgba(40,30,30,.55);z-index:50;display:flex;align-items:center;justify-content:center}
.dlg{background:#fefefd;border:3px solid #4a3b3a;border-radius:8px;padding:18px;width:min(520px,92vw);max-height:80vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>
</head><body>

<script>/* ATMlib Track Editor core: song model, presets, exporter, interpreter, renderer.
   No DOM in here, so it can be tested in node. */
(function (root) {
'use strict';

/* =====================================================================
   Notes
   ===================================================================== */
const PC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteName(n) { const i = n - 1; return PC[((i % 12) + 12) % 12] + (2 + Math.floor(i / 12)); }
function noteMacro(n) { return 'ATM_NOTE_' + noteName(n).replace(/^([A-G])#(\d)$/, '$1$2_'); }
function isBlackKey(n) { return [1, 3, 6, 8, 10].indexOf(((n - 1) % 12 + 12) % 12) >= 0; }
const NOTE_MIN = 1, NOTE_MAX = 63;

/* =====================================================================
   Command table (values from ATMcmds.h / README section 3)
   n = number of parameter bytes, sg = which args are signed
   ===================================================================== */
const OPS = {
  vol:      { op: 0x40, mac: 'ATM_VOL',          n: 1 },
  slvol:    { op: 0x41, mac: 'ATM_SL_VOL',       n: 1, sg: [1] },
  slvola:   { op: 0x42, mac: 'ATM_SL_VOL_ADV',   n: 2, sg: [1, 0] },
  slvoloff: { op: 0x43, mac: 'ATM_SL_VOL_OFF',   n: 0 },
  slfrq:    { op: 0x44, mac: 'ATM_SL_FRQ',       n: 1, sg: [1] },
  slfrqa:   { op: 0x45, mac: 'ATM_SL_FRQ_ADV',   n: 2, sg: [1, 0] },
  slfrqoff: { op: 0x46, mac: 'ATM_SL_FRQ_OFF',   n: 0 },
  arp:      { op: 0x47, mac: 'ATM_ARP',          n: 2 },
  arpoff:   { op: 0x48, mac: 'ATM_ARP_OFF',      n: 0 },
  nse:      { op: 0x49, mac: 'ATM_NOISE',        n: 1 },
  nseoff:   { op: 0x4A, mac: 'ATM_NOISE_OFF',    n: 0 },
  addtra:   { op: 0x4B, mac: 'ATM_ADD_TRA',      n: 1, sg: [1] },
  settra:   { op: 0x4C, mac: 'ATM_SET_TRA',      n: 1, sg: [1] },
  traoff:   { op: 0x4D, mac: 'ATM_TRA_OFF',      n: 0 },
  trem:     { op: 0x4E, mac: 'ATM_TREM',         n: 2 },
  tremoff:  { op: 0x4F, mac: 'ATM_TREM_OFF',     n: 0 },
  vib:      { op: 0x50, mac: 'ATM_VIB',          n: 2 },
  viboff:   { op: 0x51, mac: 'ATM_VIB_OFF',      n: 0 },
  glis:     { op: 0x52, mac: 'ATM_GLIS',         n: 1 },
  glisoff:  { op: 0x53, mac: 'ATM_GLIS_OFF',     n: 0 },
  cut:      { op: 0x54, mac: 'ATM_CUT',          n: 1 },
  cutoff:   { op: 0x55, mac: 'ATM_CUT_OFF',      n: 0 },
  cue:      { op: 0x57, mac: 'ATM_CUE',          n: 1 },
  addtmp:   { op: 0x9C, mac: 'ATM_ADD_TEMPO',    n: 1, sg: [1] },
  settmp:   { op: 0x9D, mac: 'ATM_SET_TEMPO',    n: 1 }
};
const OP_BY_CODE = {};
Object.keys(OPS).forEach(k => { OP_BY_CODE[OPS[k].op] = k; });

/* parameter bytes per opcode, for the interpreter (0x56 unused) */
function paramCount(op) {
  if (op >= 0x40 && op <= 0x9F) {
    if (OP_BY_CODE[op]) return OPS[OP_BY_CODE[op]].n;
    if (op === 0x9E) return 4;
    return 0;
  }
  return 0;
}

/* a command object: {b: [bytes], t: 'ATM_...'} */
function mkCmd(key, args, ctx) {
  const d = OPS[key];
  args = args || [];
  const bytes = [d.op];
  const txt = [];
  for (let i = 0; i < d.n; i++) {
    let v = args[i] | 0;
    const signed = d.sg && d.sg[i];
    let s;
    if (ctx && ctx.gv) {
      if (key === 'vol' && i === 0) { const m = Math.trunc(v * ctx.gv / 100); bytes.push(m & 255); txt.push('MV(' + v + ')'); continue; }
      if (key === 'slvol' && v < 0) {
        const mag = -v; let m = Math.trunc((mag * ctx.gv + 50) / 100); if (m < 1) m = 1;

      }
    }
    bytes.push(v & 255);
    if (signed && v < 0) s = '(uint8_t)' + v; else s = String(v & 255);

    else if (n <= 192) { out.push({ b: [0xE0, n - 65], t: 'ATM_LONG_DELAY(' + n + ')' }); n = 0; }

const CMD_SILENCE = { b: [0x00], t: '0x00', cm: 'note off' };

   ===================================================================== */
const CHORDS = [
  { id: 'maj',  name: 'Major',            a: 0x43, two: false },
  { id: 'min',  name: 'Minor',            a: 0x34, two: false },
  { id: 'maj1', name: 'Major, 1st inv.',  a: 0x35, two: false },
  { id: 'maj2', name: 'Major, 2nd inv.',  a: 0x54, two: false },
  { id: 'min1', name: 'Minor, 1st inv.',  a: 0x45, two: false },
  { id: 'min2', name: 'Minor, 2nd inv.',  a: 0x53, two: false },
  { id: 'maj7', name: 'Maj7 (no 5th)',    a: 0x47, two: false },
  { id: 'min7', name: 'm7 (no 5th)',      a: 0x37, two: false },
  { id: 'sus4', name: 'Sus4',             a: 0x52, two: false },
  { id: 'dim',  name: 'Diminished',       a: 0x33, two: false },
  { id: 'aug',  name: 'Augmented',        a: 0x44, two: false },
  { id: 'pow',  name: 'Power (root+5th)', a: 0x70, two: true  },

    len: o.len || 64, color: o.color || pickColor(song), inst: o.inst || null,
    notes: o.notes ? clone(o.notes) : [], hits: o.hits ? clone(o.hits) : [], fx: o.fx ? clone(o.fx) : []

/* keep a tone pattern monophonic and inside its length */
function normalizeTone(P) {
  const out = [];
  P.notes.sort((a, b) => a.t - b.t || b.l - a.l);
  for (const n of P.notes) {
    n.t = Math.max(0, Math.round(n.t)); n.l = Math.max(1, Math.round(n.l)); n.n = clamp(Math.round(n.n), NOTE_MIN, NOTE_MAX);
    if (n.t >= P.len) continue;
    if (n.t + n.l > P.len) n.l = P.len - n.t;
    const prev = out[out.length - 1];
    if (prev && prev.t === n.t) { out[out.length - 1] = n; continue; }
    if (prev && prev.t + prev.l > n.t) prev.l = n.t - prev.t;
    out.push(n);
  }
  P.notes = out;
}
/* write a note and make room for it (the new note wins) */
function putNote(P, t, n, l) {
  l = Math.max(1, Math.min(l, P.len - t));
  P.notes = P.notes.filter(x => !(x.t >= t && x.t < t + l));
  P.notes.forEach(x => { if (x.t < t && x.t + x.l > t) x.l = t - x.t; });
  const note = { t: t, n: n, l: l };
  P.notes.push(note); P.notes.sort((a, b) => a.t - b.t);
  return note;
}

  const h = { t: t, d: d }; if (v !== undefined) h.v = v;
  P.hits.push(h); P.hits.sort((a, b) => a.t - b.t);

/* instrument -> list of fx events at tick 0 */
function instEvents(I) {
  const ev = [{ k: 'vol', a: [I.vol | 0] }];
  const s = I.slide || { k: 'none' };
  if (s.k === 'vol') ev.push({ k: 'slvol', a: [s.s] });
  else if (s.k === 'volAdv') ev.push({ k: 'slvola', a: [s.s, s.t | 0] });
  else if (s.k === 'frq') ev.push({ k: 'slfrq', a: [s.s] });
  else if (s.k === 'frqAdv') ev.push({ k: 'slfrqa', a: [s.s, s.t | 0] });
  else ev.push({ k: 'slvoloff', a: [] });
  const g = I.gate || { k: 'none' };
  if (g.k === 'arp') { const c = chordById(g.chord) || CHORDS[1]; ev.push({ k: 'arp', a: [g.a !== undefined ? g.a : c.a, arpY(g.ticks || 1, g.retrig !== false, c.two)] }); }
  else if (g.k === 'cut') ev.push({ k: 'cut', a: [g.n | 0] });
  else ev.push({ k: 'arpoff', a: [] });
  const m = I.mod || { k: 'none' };
  if (m.k === 'vib') ev.push({ k: 'vib', a: [m.d | 0, m.r | 0] });
  else if (m.k === 'trem') ev.push({ k: 'trem', a: [m.d | 0, m.r | 0] });
  else ev.push({ k: 'viboff', a: [] });
  const l = I.glis || { k: 'none' };
  if (l.k === 'up') ev.push({ k: 'glis', a: [(Math.max(2, l.t | 0) - 1) & 127] });
  else if (l.k === 'down') ev.push({ k: 'glis', a: [0x80 | ((Math.max(2, l.t | 0) - 1) & 127)] });
  else ev.push({ k: 'glisoff', a: [] });
  return ev;
}

  el.appendChild(h('div', { class: 'hint' }, 'Used as the array name: ATM.play(' + A.cIdent(song.name) + ');'));
  el.appendChild(field('Title', h('input', { type: 'text', value: song.title || '', style: 'width:150px', onchange: e => mutate(() => { song.title = e.target.value; }) })));

  el.appendChild(h('div', { class: 'row' }, h('label', null, h('input', { type: 'checkbox', checked: song.loop, onchange: e => mutate(() => { song.loop = e.target.checked; }) }), ' Loop forever')));
  el.appendChild(h('div', { class: 'hint' }, song.loop ? 'Hop-free loop: every channel ends by jumping to its own start. All lanes are padded to the same length.' : 'Plays once and stops. The last note is cut at the end, so leave a rest block after it to let it ring out.'));
  el.appendChild(h('div', { class: 'row' }, h('label', null, h('input', { type: 'checkbox', checked: song.includeTempo, onchange: e => mutate(() => { song.includeTempo = e.target.checked; }) }), ' Put ATM_SET_TEMPO inside the song')));
  el.appendChild(h('div', { class: 'row' }, h('label', null, h('input', { type: 'checkbox', checked: song.gameVol, onchange: e => mutate(() => { song.gameVol = e.target.checked; }) }), ' In-game music volume'),
    song.gameVol ? numIn(song.gamePct, 10, 100, v => mutate(() => { song.gamePct = v; }), 52) : null, song.gameVol ? '%' : null));
  el.appendChild(h('div', { class: 'hint' }, 'Scales all volumes with the MV/MS macros so the music sits under the sound effects (60% is a good start).'));
  el.appendChild(field('Bar length', numIn(song.barTicks || 64, 4, 256, v => mutate(() => { song.barTicks = v; }))));
  el.appendChild(h('h2', null, 'Keys'));
  el.appendChild(h('div', { class: 'hint', style: 'line-height:1.9' },
    h('kbd', null, 'Space'), ' play / stop  ', h('kbd', null, 'Ctrl+Z'), ' undo  ', h('kbd', null, 'Ctrl+Shift+Z'), ' redo', h('br'),
    'Piano roll: click to add a note, drag to move, drag the right edge to resize, right-click (or Shift+click) to delete.', h('br'),
    'Type notes: ', h('kbd', null, 'A W S E D F T G Y H U J K'), ' = C…C, ', h('kbd', null, 'Z X'), ' octave, arrows move the cursor. Drum patterns: ', h('kbd', null, 'K S H O C…'), ' (see key letters on the rows).', h('br'),
    h('kbd', null, 'Delete'), ' removes the selected block or the note at the cursor.'));
}
function rightSel(el) {
  const P = curP(); const f = UI.selUid && findPl(UI.selUid);
  if (!P && !f) { el.appendChild(h('p', { class: 'hint' }, 'Select a pattern or a block on a lane.')); return; }
  if (f) {
    el.appendChild(h('h2', null, 'Block on CH' + f.ch));
    if (P.kind === 'tone') {
      el.appendChild(field('Transpose', numIn(f.pl.tra, -48, 48, v => mutate(() => { f.pl.tra = v; }))));
      el.appendChild(h('div', { class: 'row' }, h('button', { class: 'sm', onclick: () => mutate(() => { f.pl.tra -= 12; }) }, '−1 octave'), h('button', { class: 'sm', onclick: () => mutate(() => { f.pl.tra += 12; }) }, '+1 octave'), h('button', { class: 'sm ghost', onclick: () => mutate(() => { f.pl.tra = 0; }) }, '0')));
      el.appendChild(h('div', { class: 'hint' }, 'Reuse one pattern in another key: the notes stay the same, only this block moves. The sum of note and transposition must stay inside C2…D7.'));
    }
    el.appendChild(h('div', { class: 'row' },
      h('button', { class: 'sm', onclick: () => mutate(() => { const Q = A.duplicatePattern(song, P.id); f.pl.pid = Q.id; UI.selPid = Q.id; }) }, 'Make this block unique'),
      h('button', { class: 'sm ghost', onclick: () => mutate(() => { song.lanes[f.ch].splice(f.i, 1); UI.selUid = null; }) }, 'Remove from lane')));
    el.appendChild(h('div', { class: 'hint' }, 'Used ' + A.patternUses(song, P.id) + '× in the song. "Unique" gives this block its own copy to edit.'));
  }
  if (P) {
    el.appendChild(h('h2', null, 'Pattern "' + P.name + '"'));
    el.appendChild(field('Colour', h('div', { class: 'row' }, A.COLORS.map(c => h('span', { style: 'width:16px;height:16px;border-radius:3px;cursor:pointer;background:' + c + (c === P.color ? ';outline:2px solid #f4d35e' : ''), onclick: () => mutate(() => { P.color = c; }) })))));
    if (P.kind === 'tone') { instrumentBox(el, P); fxBox(el, P); }
    else el.appendChild(h('p', { class: 'hint' }, 'Drum patterns use the kit voices (Drums tab). Click cells in the grid to place hits.'));
  }
}
function instrumentBox(el, P) {
  el.appendChild(h('h2', null, 'Instrument'));
  const ids = Object.keys(song.instruments);
  el.appendChild(h('div', { class: 'row' }, h('select', { class: 'light', onchange: e => mutate(() => { P.inst = e.target.value || null; }) },
    h('option', { value: '' }, '(none: plain notes)'), ids.map(id => h('option', { value: id, selected: P.inst === id }, song.instruments[id].name))),
    h('button', { class: 'sm', onclick: () => { UI.left = 'instruments'; renderLeft(); } }, 'Browse…')));
  const I = P.inst && song.instruments[P.inst]; if (!I) { el.appendChild(h('p', { class: 'hint' }, 'Without an instrument every note plays at full volume with no fade. Pick one from the Instruments tab.')); return; }
  const ed = fn => mutate(() => fn(I));
  el.appendChild(field('Name', h('input', { type: 'text', value: I.name, style: 'width:140px', onchange: e => ed(i => { i.name = e.target.value || i.name; }) })));
  el.appendChild(field('Volume', numIn(I.vol, 0, 63, v => ed(i => { i.vol = v; }))));
  const sel = (val, opts, fn) => h('select', { class: 'light', onchange: e => fn(e.target.value) }, opts.map(o => h('option', { value: o[0], selected: o[0] === val }, o[1])));
  el.appendChild(field('Fade', sel(I.slide.k, [['none', 'none (constant)'], ['vol', 'volume slide'], ['volAdv', 'volume slide, every N ticks'], ['frq', 'pitch slide'], ['frqAdv', 'pitch slide, every N ticks']], k => ed(i => { i.slide = { k: k, s: i.slide.s || (k.indexOf('vol') === 0 ? -2 : 1), t: i.slide.t || 2 }; }))));
  if (I.slide.k !== 'none') el.appendChild(field('Step', numIn(I.slide.s, -127, 127, v => ed(i => { i.slide.s = v; }))));
  if (/Adv/.test(I.slide.k)) el.appendChild(field('Every N ticks', numIn(I.slide.t, 1, 255, v => ed(i => { i.slide.t = v; }))));
  el.appendChild(field('Gate', sel(I.gate.k, [['none', 'none'], ['arp', 'arpeggio (chord)'], ['cut', 'note gate (cut)']], k => ed(i => { i.gate = Object.assign({ chord: 'min', ticks: 1, retrig: true, n: 2 }, i.gate, { k: k }); delete i.gate.a; }))));
  if (I.gate.k === 'arp') {
    el.appendChild(field('Chord', sel(I.gate.chord, A.CHORDS.map(c => [c.id, c.name || c.id]), v => ed(i => { i.gate.chord = v; delete i.gate.a; }))));
    el.appendChild(field('Ticks/step', numIn(I.gate.ticks || 1, 1, 32, v => ed(i => { i.gate.ticks = v; }))));
  }
  if (I.gate.k === 'cut') el.appendChild(field('Sounds for', numIn(I.gate.n || 2, 1, 63, v => ed(i => { i.gate.n = v; }))));
  el.appendChild(field('Modulation', sel(I.mod.k, [['none', 'none'], ['vib', 'vibrato'], ['trem', 'tremolo']], k => ed(i => { i.mod = { k: k, d: i.mod.d || 2, r: i.mod.r || 3 }; }))));
  if (I.mod.k !== 'none') { el.appendChild(field('Depth', numIn(I.mod.d, 0, 255, v => ed(i => { i.mod.d = v; })))); el.appendChild(field('Rate', numIn(I.mod.r, 0, 255, v => ed(i => { i.mod.r = v; })))); }
  el.appendChild(field('Glide', sel(I.glis.k, [['none', 'none'], ['up', 'glide up'], ['down', 'glide down']], k => ed(i => { i.glis = { k: k, t: i.glis.t || 2 }; }))));
  if (I.glis.k !== 'none') el.appendChild(field('Ticks/step', numIn(I.glis.t, 2, 128, v => ed(i => { i.glis.t = v; }))));
  el.appendChild(h('div', { class: 'row' }, h('label', { title: 'Silence the channel at the end of a note when it is followed by a rest' }, h('input', { type: 'checkbox', checked: !!I.cut, onchange: e => ed(i => { i.cut = e.target.checked; }) }), ' Cut note at its end')));
  el.appendChild(h('div', { class: 'row' }, h('button', { class: 'sm', onclick: () => auditInst(I) }, '▶ Listen'),
    h('button', { class: 'sm ghost', onclick: () => mutate(() => { const id = 'i' + (song.seq++); song.instruments[id] = Object.assign(A.clone(I), { id: id, name: I.name + ' copy' }); P.inst = id; }) }, 'Copy as new'),
    h('span', { class: 'hint' }, A.patternUses ? 'Shared by every pattern that uses it.' : '')));
}
const FXKINDS = [['vol', 'Volume'], ['slvol', 'Volume slide'], ['slvola', 'Volume slide (every N)'], ['slvoloff', 'Volume slide off'], ['slfrq', 'Pitch slide'], ['slfrqa', 'Pitch slide (every N)'], ['slfrqoff', 'Pitch slide off'], ['arp', 'Arpeggio'], ['arpoff', 'Arpeggio off'], ['vib', 'Vibrato'], ['trem', 'Tremolo'], ['viboff', 'Vibrato off'], ['tremoff', 'Tremolo off'], ['glis', 'Glide'], ['glisoff', 'Glide off'], ['cut', 'Note gate'], ['cutoff', 'Note gate off'], ['nse', 'Noise'], ['nseoff', 'Noise off']];
const FXARGS = { vol: ['Volume 0-63'], slvol: ['Step ±'], slvola: ['Step ±', 'Every N'], slfrq: ['Step ±'], slfrqa: ['Step ±', 'Every N'], vib: ['Depth', 'Rate'], trem: ['Depth', 'Rate'], cut: ['Ticks'], nse: ['Value'], glis: ['Ticks/step'] };
const FXDEF = { vol: [30], slvol: [-2], slvola: [-2, 2], slfrq: [1], slfrqa: [1, 2], vib: [2, 3], trem: [2, 3], cut: [4], nse: [1], glis: [2], arp: [2] };
const newFx = { k: 'vol', v: [30], chord: 'min', dir: 'up' };
function fxBox(el, P) {
  el.appendChild(h('h2', null, 'Effects in this pattern'));
  el.appendChild(h('p', { class: 'hint' }, 'Extra commands on a tick, on top of the instrument: a volume swell, a vibrato from tick 32… Markers show in the strip above the piano roll.'));
  P.fx.forEach((e, i) => {
    el.appendChild(h('div', { class: 'item', style: 'cursor:default' + (i === UI.selFx ? ';border-color:#c0392b' : ''), onclick: () => { UI.selFx = i; redrawPed && redrawPed(); renderRight(); } },
      h('span', { class: 'nm' }, 't' + e.t + ' ' + fxLabel(e) + (e.a && e.a.length ? ' ' + e.a.join(',') : '')),
      numIn(e.t, 0, P.len - 1, v => mutate(() => { e.t = v; }), 54), h('button', { class: 'sm ghost', onclick: ev => { ev.stopPropagation(); mutate(() => { P.fx.splice(i, 1); UI.selFx = -1; }); } }, '✕')));
  });
  const k = newFx.k; const a = h('div');
  el.appendChild(h('div', { class: 'row' }, h('select', { class: 'light', onchange: e => { newFx.k = e.target.value; newFx.v = (FXDEF[newFx.k] || [0, 0]).slice(); renderRight(); } }, FXKINDS.map(x => h('option', { value: x[0], selected: x[0] === k }, x[1])))));
  if (k === 'arp') {
    el.appendChild(field('Chord', h('select', { class: 'light', onchange: e => { newFx.chord = e.target.value; } }, A.CHORDS.map(c => h('option', { value: c.id, selected: c.id === newFx.chord }, c.name || c.id)))));
    el.appendChild(field('Ticks/step', numIn(newFx.v[0] > 32 ? 2 : newFx.v[0], 1, 32, v => { newFx.v[0] = v; })));
  } else if (k === 'glis') {
    el.appendChild(field('Ticks/step', numIn(Math.max(2, newFx.v[0]), 2, 128, v => { newFx.v[0] = v; })));
    el.appendChild(field('Direction', h('select', { class: 'light', onchange: e => { newFx.dir = e.target.value; } }, [['up', 'up'], ['down', 'down']].map(o => h('option', { value: o[0], selected: o[0] === newFx.dir }, o[1])))));
  } else (FXARGS[k] || []).forEach((lb, j) => el.appendChild(field(lb, numIn(newFx.v[j], -127, 255, v => { newFx.v[j] = v; }))));
  el.appendChild(h('div', { class: 'row' }, h('button', { class: 'sm', onclick: () => mutate(() => {
    let args = [];
    if (k === 'arp') { const c = A.chordById(newFx.chord) || A.CHORDS[1]; args = [c.a, A.arpY(newFx.v[0] > 32 ? 2 : newFx.v[0], true, c.two)]; }
    else if (k === 'glis') args = [((Math.max(2, newFx.v[0]) - 1) & 127) | (newFx.dir === 'down' ? 0x80 : 0)];
    else args = (FXARGS[k] || []).map((x, j) => newFx.v[j] | 0);
    P.fx.push({ t: A.clamp(UI.cursor, 0, P.len - 1), k: k, a: args }); P.fx.sort((x, y) => x.t - y.t);
  }) }, 'Add at cursor (tick ' + UI.cursor + ')')));
}
let exportCache = null;
function rightExport(el) {
  const res = A.buildExport(song); exportCache = res;
  el.appendChild(h('h2', null, 'Export song.h'));
  if (res.errors.length) { res.errors.forEach(e => el.appendChild(h('div', { class: 'msg err' }, e))); return; }
  res.warnings.forEach(w => el.appendChild(h('div', { class: 'msg warn' }, w)));
  el.appendChild(h('div', { class: 'msg ok' }, res.size + ' bytes · ' + res.tracks.length + ' tracks · ' + res.L + ' ticks (' + (res.L / song.tempo).toFixed(1) + ' s) · ' + (res.loop ? 'loops' : 'plays once')));
  if (!song.loop) el.appendChild(h('div', { class: 'msg warn' }, 'One-shot: the final note is cut when the song stops. Add a rest block at the end to let it ring out.'));
  const hex = UI.hex;
  el.appendChild(h('div', { class: 'row' }, h('label', null, h('input', { type: 'checkbox', checked: !!hex, onchange: e => { UI.hex = e.target.checked; renderRight(); } }), ' Only the raw bytes (hex)')));
  const text = hex ? A.exportHex(song, res) : A.exportText(song, res);
  const ta = h('textarea', { class: 'code', readonly: true, spellcheck: 'false' }); ta.value = text;
  el.appendChild(ta);
  el.appendChild(h('div', { class: 'row' },
    h('button', { onclick: () => { ta.select(); try { navigator.clipboard.writeText(text); toast('Copied.'); } catch (e) { document.execCommand('copy'); toast('Copied.'); } } }, 'Copy'),
    h('button', { onclick: () => download(A.cIdent(song.name) + '.h', text) }, 'Download ' + A.cIdent(song.name) + '.h')));
  el.appendChild(h('p', { class: 'hint' }, 'Put the file next to your sketch, #include it, call ATM.setTempo(' + song.tempo + ') and ATM.play(' + A.cIdent(song.name) + ').'));
}

/* ------------------------------------------------------------ keyboard */
const KEYSEMI = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, ';': 16 };
document.addEventListener('keydown', e => {
  const tg = e.target; if (tg && /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName) && tg.type !== 'range' && tg.type !== 'checkbox') return;
  const k = e.key.toLowerCase(); const mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && k === 'y') { e.preventDefault(); doRedo(); return; }
  if (mod || e.altKey) return;
  if (k === ' ') { e.preventDefault(); playSong(); return; }
  const P = curP();
  if (k === 'delete' || k === 'backspace') {
    e.preventDefault();
    if (UI.focus === 'arr' && UI.selUid) { const f = findPl(UI.selUid); if (f) mutate(() => { song.lanes[f.ch].splice(f.i, 1); UI.selUid = null; }); return; }
    if (P) mutate(() => {
      if (P.kind === 'tone') { const n = P.notes.find(q => UI.cursor >= q.t && UI.cursor < q.t + q.l); if (n) P.notes = P.notes.filter(q => q !== n); }
      else P.hits = P.hits.filter(q => q.t !== UI.cursor);
    });
    return;
  }
  if (!P) return;
  if (k === 'arrowright' || k === 'arrowleft') { e.preventDefault(); UI.cursor = A.clamp(UI.cursor + (k === 'arrowright' ? 1 : -1) * UI.snap, 0, P.len - 1); redrawPed && redrawPed(); return; }
  if (P.kind === 'tone') {
    if (k === 'z' || k === 'x') { UI.oct = A.clamp(UI.oct + (k === 'x' ? 1 : -1), 1, 7); renderPed(); return; }
    if (KEYSEMI[k] !== undefined) {
      const n = 1 + KEYSEMI[k] + 12 * (UI.oct - 2); if (n < 1 || n > 63) return; e.preventDefault();
      const len = UI.lastLen || UI.snap; const t = UI.cursor;
      if (t >= P.len) return;
      mutate(() => { A.putNote(P, t, n, len); UI.cursor = Math.min(P.len - 1, t + len); }); auditNote(P, n);
    }
  } else {
    const d = A.KIT_ORDER.find(id => (song.kit[id] || A.KIT_DEFAULT[id]).key.toLowerCase() === k);
    if (d) { e.preventDefault(); const t = UI.cursor; mutate(() => { A.putHit(P, t, d); UI.cursor = Math.min(P.len - 1, t + UI.snap); }); auditHit(d); }
  }
});

/* ------------------------------------------------------------ render */
function renderAll() {
  fixSel(); updateHeader(); renderLeft(); renderArr(); renderPed(); renderRight();
}
initHeader(); renderAll();
window.__atmed = { get song() { return song; }, UI: UI, renderAll: renderAll, playSong: playSong };
})();
</script>
